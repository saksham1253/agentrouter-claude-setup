name: Local tests and publication scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun test
      - run: bun scripts/scan-public.ts
      - name: Parse PowerShell bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/bootstrap.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Out-String | Write-Error; exit 1 }
